name: Docker CI

# Builds the container image and smoke-tests it. Runs only when something the
# image build depends on changes.

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - CMakeLists.txt
      - cmake/**
      - src/**
      - include/**
      - viz/**
      - tests/**
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - CMakeLists.txt
      - cmake/**
      - src/**
      - include/**
      - viz/**
      - tests/**
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Get Docker Metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: hyphy3
          tags: |
            type=raw,value=ci
      - name: Build Docker Image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Smoke test (default command prints help)
        run: docker run --rm hyphy3:ci
      - name: Smoke test (version)
        run: docker run --rm hyphy3:ci hyphy3 --version
      - name: Smoke test (no entrypoint, shell command works)
        run: docker run --rm hyphy3:ci sh -c "hyphy3-fel --help"
      - name: Smoke test (every installed binary starts)
        run: docker run --rm hyphy3:ci sh -c 'for b in /usr/local/bin/hyphy3*; do "$b" --help >/dev/null || { echo "FAIL $b"; exit 1; }; done'
